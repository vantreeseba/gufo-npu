name: Linux build

# Builds the Dockerfile on a hosted runner. The build stage compiles the host
# binaries and NPU kernels (no NPU needed) and runs the CPU tests. Uploads the
# installed tree as an artifact and, when asked, pushes the runtime image.

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_tag="$(printf '%s' "${ref}" | tr -c 'A-Za-z0-9_.-' '-')"
          {
            echo "image=${image}"
            echo "tags=${image}:${branch_tag},${image}:sha-${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The toolchain layers (XRT, mlir-aie, Peano) change rarely, so the
      # GitHub Actions cache keeps rebuilds to the source stages.
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package installed tree
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          container="$(docker create "${IMAGE}")"
          docker cp "${container}:/opt/gufo-npu" gufo-npu
          docker rm "${container}"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf gufo-npu-linux-x86_64.tar.gz gufo-npu
          {
            echo "### gufo-npu ${GITHUB_SHA::12}"
            echo '```'
            find gufo-npu -type f | sort
            echo '```'
            if [[ "${{ inputs.push }}" == "true" ]]; then
              echo "Image: \`${IMAGE}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installed tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gufo-npu-linux-x86_64-${{ github.sha }}
          path: gufo-npu-linux-x86_64.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
