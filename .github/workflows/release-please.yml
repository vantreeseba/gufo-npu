name: Release Please

# Keeps a release pull request up to date from Conventional Commit titles on
# main, and tags the release when it merges. Uses the job token, so the
# release PR does not trigger other workflows; run CI on it manually
# (workflow_dispatch) before merging.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Maintain release pull request or publish merged release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
